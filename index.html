<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-accent="red">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Petit Buffet | Carrinhos Gourmet</title>
  
  <script>
    (function(){
      try{
        var t=localStorage.getItem('petit-theme'); if(t!=='light'&&t!=='dark') t='dark';
        var a=localStorage.getItem('petit-accent'); if(['red','blue','purple','green', 'orange'].indexOf(a)<0) a='orange';
        var h=document.documentElement; h.setAttribute('data-theme',t); h.setAttribute('data-accent',a);
      }catch(e){
        document.documentElement.setAttribute('data-theme','dark');
        document.documentElement.setAttribute('data-accent','orange');
      }
    })();
  </script>

  <style>
    /* ==========================================================================
       DESIGN TOKENS & VARIÁVEIS (Estilo Loop Setups)
       ========================================================================== */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      /* Cores de Acento */
      --acc-red: #ef4444;    --acc-red-glow: rgba(239, 68, 68, 0.2);
      --acc-blue: #3b82f6;   --acc-blue-glow: rgba(59, 130, 246, 0.2);
      --acc-purple: #8b5cf6; --acc-purple-glow: rgba(139, 92, 246, 0.2);
      --acc-green: #10b981;  --acc-green-glow: rgba(16, 185, 129, 0.2);
      --acc-orange: #f97316; --acc-orange-glow: rgba(249, 115, 22, 0.2);
      
      --font-main: 'Inter', sans-serif;
      --radius: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Temas */
    [data-theme="dark"] {
      --bg-base: #0f1115;
      --bg-surface: #1a1d24;
      --bg-card: #222630;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255,255,255,0.08);
      --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.5);
    }
    [data-theme="light"] {
      --bg-base: #f8fafc;
      --bg-surface: #ffffff;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: rgba(0,0,0,0.08);
      --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    /* Aplicação do Acento */
    [data-accent="red"] { --accent: var(--acc-red); --accent-glow: var(--acc-red-glow); }
    [data-accent="blue"] { --accent: var(--acc-blue); --accent-glow: var(--acc-blue-glow); }
    [data-accent="purple"] { --accent: var(--acc-purple); --accent-glow: var(--acc-purple-glow); }
    [data-accent="green"] { --accent: var(--acc-green); --accent-glow: var(--acc-green-glow); }
    [data-accent="orange"] { --accent: var(--acc-orange); --accent-glow: var(--acc-orange-glow); }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-base);
      color: var(--text-main);
      line-height: 1.5;
      overflow-x: hidden;
      transition: background-color var(--transition), color var(--transition);
    }

    /* ==========================================================================
       HEADER & NAVEGAÇÃO
       ========================================================================== */
    header {
      position: sticky; top: 0; z-index: 100;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(10px);
    }
    .brand {
      font-size: 1.5rem; font-weight: 800;
      letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 8px;
    }
    .brand span { color: var(--accent); }
    
    .header-actions { display: flex; gap: 1rem; align-items: center; }
    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: var(--transition);
      position: relative;
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .cart-badge {
      position: absolute; top: -5px; right: -5px;
      background: var(--accent); color: #fff;
      font-size: 0.75rem; font-weight: bold;
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }

    /* ==========================================================================
       HERO & FILTROS
       ========================================================================== */
    .hero {
      padding: 4rem 2rem; text-align: center;
      background: linear-gradient(to bottom, var(--accent-glow), transparent);
    }
    .hero h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
    .hero p { color: var(--text-muted); max-width: 600px; margin: 0 auto; }

    .filters {
      display: flex; justify-content: center; gap: 1rem;
      padding: 1rem 2rem; margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1.5rem;
      border-radius: 30px; font-weight: 600;
      cursor: pointer; transition: var(--transition);
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff; border-color: var(--accent);
    }

    /* ==========================================================================
       GRID DE PRODUTOS (LÓGICA DE CENTOS)
       ========================================================================== */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem 4rem; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex; flex-direction: column;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .card:hover { transform: translateY(-5px); border-color: var(--accent); }
    
    .card-img {
      width: 100%; height: 180px;
      background: var(--bg-surface);
      border-radius: 8px; margin-bottom: 1rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
    }
    .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    .card-desc { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; flex-grow: 1; }
    
    /* Seletor de Quantidade (O Segredo dos Centos) */
    .batch-selector {
      width: 100%; padding: 0.75rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      margin-bottom: 1rem;
      font-family: var(--font-main);
      font-weight: 600; outline: none;
      cursor: pointer; transition: var(--transition);
    }
    .batch-selector:focus { border-color: var(--accent); }
    
    .price-display {
      font-size: 1.5rem; font-weight: 800; color: var(--accent);
      margin-bottom: 1rem;
    }

    .btn-add {
      width: 100%; padding: 0.875rem;
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      border-radius: 8px; font-weight: 700;
      cursor: pointer; transition: var(--transition);
    }
    .btn-add:hover { background: var(--accent); color: #fff; }

    /* ==========================================================================
       CARRINHO LATERAL (SIDEBAR)
       ========================================================================== */
    .cart-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
      z-index: 999; opacity: 0; visibility: hidden; transition: var(--transition);
    }
    .cart-overlay.active { opacity: 1; visibility: visible; }
    
    .cart-sidebar {
      position: fixed; top: 0; right: -400px;
      width: 100%; max-width: 400px; height: 100%;
      background: var(--bg-surface);
      border-left: 1px solid var(--border-color);
      z-index: 1000; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
    }
    .cart-sidebar.active { right: 0; }
    
    .cart-header {
      padding: 1.5rem; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cart-header h2 { font-size: 1.25rem; font-weight: 700; }
    .close-cart { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
    
    .cart-items { flex-grow: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--bg-card); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color);
    }
    .item-info h4 { font-size: 0.9rem; margin-bottom: 0.25rem; }
    .item-info p { color: var(--accent); font-weight: 700; }
    .item-remove { background: none; border: none; color: var(--acc-red); cursor: pointer; font-size: 1.2rem; }
    
    .cart-footer { padding: 1.5rem; border-top: 1px solid var(--border-color); background: var(--bg-card); }
    .cart-total { display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800; margin-bottom: 1.5rem; }
    .btn-checkout {
      width: 100%; padding: 1rem; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-weight: 700; font-size: 1.1rem; cursor: pointer;
    }

    /* ==========================================================================
       PAINEL DE CONFIGURAÇÕES (THEMES & ACCENTS)
       ========================================================================== */
    .settings-panel {
      position: fixed; bottom: 20px; left: 20px;
      background: var(--bg-card); border: 1px solid var(--border-color);
      padding: 1rem; border-radius: 12px; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 10px; z-index: 90;
    }
    .theme-toggles, .accent-toggles { display: flex; gap: 8px; }
    .tgl-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      background: var(--bg-surface); color: var(--text-main); font-size: 12px;
    }
    .tgl-btn.active { border-color: var(--text-main); }
    .color-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-dot.active { border-color: var(--text-main); transform: scale(1.1); }
    
  </style>
</head>
<body>

  <header>
    <div class="brand">Petit Buffet <span>Gourmet</span></div>
    <div class="header-actions">
      <button class="btn-icon" onclick="toggleCart()">
        🛒 <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <h1>Excelência em cada detalhe</h1>
    <p>Selecione a quantidade ideal para o seu evento. Trabalhamos com centos e meios centos para garantir a melhor experiência em Rio Branco.</p>
  </section>

  <div class="filters">
    <button class="filter-btn active" onclick="filterMenu('all')">Todos</button>
    <button class="filter-btn" onclick="filterMenu('hamburguer')">Hambúrgueres</button>
    <button class="filter-btn" onclick="filterMenu('salgado')">Salgados Finos</button>
  </div>

  <div class="container">
    <div class="product-grid" id="menu-grid">
      </div>
  </div>

  <div class="cart-overlay" id="cart-overlay" onclick="toggleCart()"></div>
  <div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
      <h2>Seu Pedido</h2>
      <button class="close-cart" onclick="toggleCart()">×</button>
    </div>
    <div class="cart-items" id="cart-items">
      </div>
    <div class="cart-footer">
      <div class="cart-total">
        <span>Total:</span>
        <span id="cart-total-price">R$ 0,00</span>
      </div>
      <button class="btn-checkout" onclick="finalizeOrder()">Finalizar no WhatsApp</button>
    </div>
  </div>

  <div class="settings-panel">
    <div class="theme-toggles">
      <button class="tgl-btn" onclick="setTheme('dark')" title="Dark Mode">🌙</button>
      <button class="tgl-btn" onclick="setTheme('light')" title="Light Mode">☀️</button>
    </div>
    <div class="accent-toggles">
      <div class="color-dot" style="background: #f97316;" onclick="setAccent('orange')"></div>
      <div class="color-dot" style="background: #ef4444;" onclick="setAccent('red')"></div>
      <div class="color-dot" style="background: #8b5cf6;" onclick="setAccent('purple')"></div>
      <div class="color-dot" style="background: #10b981;" onclick="setAccent('green')"></div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       SISTEMA DE TEMAS & CORES
       ========================================================================== */
    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('petit-theme', theme);
    }
    function setAccent(color) {
      document.documentElement.setAttribute('data-accent', color);
      localStorage.setItem('petit-accent', color);
    }

    /* ==========================================================================
       BANCO DE DADOS LOCAL (Produtos e Estrutura de Lotes/Centos)
       ========================================================================== */
    const products = [
      {
        id: 1,
        category: 'hamburguer',
        icon: '🍔',
        name: 'Mini Hambúrguer Clássico',
        desc: 'Pão brioche artesanal, blend bovino suculento, queijo cheddar derretido e molho especial da casa.',
        batches: [
          { label: '50 Unid. (Meio Cento)', price: 180.00 },
          { label: '100 Unid. (1 Cento)', price: 340.00 },
          { label: '200 Unid. (2 Centos)', price: 650.00 }
        ]
      },
      {
        id: 2,
        category: 'hamburguer',
        icon: '🥓',
        name: 'Mini Hambúrguer Bacon',
        desc: 'Blend bovino, queijo prato, fatias de bacon crocante e maionese defumada.',
        batches: [
          { label: '50 Unid. (Meio Cento)', price: 210.00 },
          { label: '100 Unid. (1 Cento)', price: 400.00 }
        ]
      },
      {
        id: 3,
        category: 'salgado',
        icon: '🥟',
        name: 'Coxinha Gourmet de Frango',
        desc: 'Massa cremosa de batata baroa, recheio generoso de frango desfiado com catupiry original.',
        batches: [
          { label: '50 Unid. (Meio Cento)', price: 90.00 },
          { label: '100 Unid. (1 Cento)', price: 170.00 },
          { label: '500 Unid. (5 Centos)', price: 800.00 }
        ]
      },
      {
        id: 4,
        category: 'salgado',
        icon: '🧀',
        name: 'Bolinha de Queijo Trufada',
        desc: 'Mix de 4 queijos derretidos por dentro com uma casquinha extremamente crocante.',
        batches: [
          { label: '50 Unid. (Meio Cento)', price: 95.00 },
          { label: '100 Unid. (1 Cento)', price: 180.00 }
        ]
      }
    ];

    let cart = [];

    /* ==========================================================================
       RENDERIZAÇÃO DO CARDÁPIO
       ========================================================================== */
    function formatCurrency(value) {
      return value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderMenu(category = 'all') {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';

      const filtered = category === 'all' ? products : products.filter(p => p.category === category);

      filtered.forEach(product => {
        // Monta as opções do select (Dropdown de centos)
        let optionsHTML = '';
        product.batches.forEach((batch, index) => {
          optionsHTML += `<option value="${index}">${batch.label} - ${formatCurrency(batch.price)}</option>`;
        });

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-img">${product.icon}</div>
          <h3 class="card-title">${product.name}</h3>
          <p class="card-desc">${product.desc}</p>
          
          <select class="batch-selector" id="batch-${product.id}" onchange="updateDisplayPrice(${product.id})">
            ${optionsHTML}
          </select>
          
          <div class="price-display" id="price-display-${product.id}">
            ${formatCurrency(product.batches[0].price)}
          </div>
          
          <button class="btn-add" onclick="addToCart(${product.id})">Adicionar ao Pedido</button>
        `;
        grid.appendChild(card);
      });
    }

    // Atualiza o preço exibido na tela quando o usuário troca o lote (ex: de 50 para 100)
    function updateDisplayPrice(productId) {
      const product = products.find(p => p.id === productId);
      const selectEl = document.getElementById(`batch-${productId}`);
      const selectedIndex = selectEl.value;
      const newPrice = product.batches[selectedIndex].price;
      
      document.getElementById(`price-display-${productId}`).innerText = formatCurrency(newPrice);
    }

    function filterMenu(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderMenu(cat);
    }

    /* ==========================================================================
       LÓGICA DO CARRINHO
       ========================================================================== */
    function toggleCart() {
      document.getElementById('cart-sidebar').classList.toggle('active');
      document.getElementById('cart-overlay').classList.toggle('active');
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const selectEl = document.getElementById(`batch-${productId}`);
      const selectedIndex = selectEl.value;
      const selectedBatch = product.batches[selectedIndex];

      // Cria um item único combinando o nome do produto + a quantidade do lote
      const cartItem = {
        cartId: Date.now(), // ID único para o item no carrinho
        name: `${product.name} (${selectedBatch.label})`,
        price: selectedBatch.price
      };

      cart.push(cartItem);
      updateCartUI();
      
      // Feedback visual leve
      const btn = event.target;
      const originalText = btn.innerText;
      btn.innerText = "✓ Adicionado!";
      btn.style.background = "var(--accent)";
      btn.style.color = "#fff";
      setTimeout(() => {
        btn.innerText = originalText;
        btn.style.background = "transparent";
        btn.style.color = "var(--accent)";
      }, 1500);
    }

    function removeFromCart(cartId) {
      cart = cart.filter(item => item.cartId !== cartId);
      updateCartUI();
    }

    function updateCartUI() {
      const container = document.getElementById('cart-items');
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total-price');

      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Seu carrinho está vazio.</p>';
      } else {
        cart.forEach(item => {
          total += item.price;
          container.innerHTML += `
            <div class="cart-item">
              <div class="item-info">
                <h4>${item.name}</h4>
                <p>${formatCurrency(item.price)}</p>
              </div>
              <button class="item-remove" onclick="removeFromCart(${item.cartId})">🗑</button>
            </div>
          `;
        });
      }

      countEl.innerText = cart.length;
      totalEl.innerText = formatCurrency(total);
    }

    function finalizeOrder() {
      if (cart.length === 0) {
        alert("Adicione itens ao carrinho primeiro!");
        return;
      }

      let text = "*NOVO PEDIDO - PETIT BUFFET GOURMET*%0A%0A";
      let total = 0;

      cart.forEach(item => {
        text += `▪ ${item.name} - ${formatCurrency(item.price)}%0A`;
        total += item.price;
      });

      text += `%0A*Total do Pedido: ${formatCurrency(total)}*%0A%0A`;
      text += "Gostaria de prosseguir com o pagamento e informar o endereço de entrega em Rio Branco.";

      // Substitua pelo número real do seu WhatsApp
      const numeroWhatsApp = "5568999999999"; 
      window.open(`https://wa.me/${numeroWhatsApp}?text=${text}`, "_blank");
    }

    // Inicialização
    renderMenu();
  </script>
</body>
</html>
